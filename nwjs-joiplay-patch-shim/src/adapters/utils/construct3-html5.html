<!-- nwjs-joiplay-patch-shim: replaces the Construct boot script.
     The game's scripts/main.js is fetched, its exportType flipped from nwjs to
     html5 in memory, and the result imported as a blob module. The file on disk
     is never touched. -->
{{CONTROLLER_SCRIPT}}<script type="module">
  console.log("joiplay-shim debug");
  const res = await fetch("{{MAIN_PATH}}");
  if (!res.ok) throw new Error("joiplay-shim: could not fetch {{MAIN_PATH}} (" + res.status + ")");
  const src = await res.text();
  const patched = src.replace('exportType:"nwjs"', 'exportType:"html5"');
  if (patched === src) throw new Error("joiplay-shim: exportType:\"nwjs\" not found in {{MAIN_PATH}}");
  await import(URL.createObjectURL(new Blob([patched], { type: "text/javascript" })));
</script>
